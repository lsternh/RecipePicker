spring.datasource.driver=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.datasource.url=jdbc:postgresql://localhost:5432/recipes

logging.config = classpath:logback-spring.xml

hibernate.c3p0.min_size=5
hibernate.c3p0.max_size=20
hibernate.c3p0.acquire_increment=5
hibernate.c3p0.timeout=1800


server.port=8101

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.http.multipart.max-file-size=50MB
spring.http.multipart.max-request-size=50MB

file.upload.dir=F:/RecipePickerImages/
file.chunk.upload.dir=${user.home}/Downloads/RecipePicker

# S3 image storage. Credentials are intentionally not kept here: the AWS SDK uses
# its default credentials chain (AWS_PROFILE / ~/.aws credentials locally, IAM role in AWS).
app.s3.bucket=${S3_BUCKET:recipe-picker3352}
app.s3.region=${AWS_REGION:us-east-2}
app.s3.key-prefix=${S3_IMAGE_PREFIX:RecipeImages/}

max_allowed_packet=100000000

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis